[project]
name = "chat-app"
version = "0.1.0"
description = "Skeleton chat web app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.116",
    "fastapi>=0.115",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
